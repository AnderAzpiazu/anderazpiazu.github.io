<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina la Bandera</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .game-container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .flag-img {
      width: 200px;
      height: 130px;
      object-fit: cover;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 1.5rem;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #007bff;
      border-radius: 6px;
      background-color: #ffffff;
      color: #007bff;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background-color: #007bff;
      color: white;
    }
    button.correct {
      background-color: #28a745 !important;
      color: white !important;
      border-color: #28a745 !important;
    }
    button.incorrect {
      background-color: #dc3545 !important;
      color: white !important;
      border-color: #dc3545 !important;
    }
    .score {
      margin-top: 1.5rem;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

<div class="game-container">
  <h2>¿Qué país es?</h2>
  <img id="flag" class="flag-img" src="" alt="Bandera">
  <div class="options-grid" id="options"></div>
  <div class="score">Puntuación: <span id="score">0</span></div>
</div>

<script>
  const countries = [
    { name: "España", code: "es" },
    { name: "Francia", code: "fr" },
    { name: "Alemania", code: "de" },
    { name: "Italia", code: "it" },
    { name: "México", code: "mx" },
    { name: "Argentina", code: "ar" },
    { name: "Japón", code: "jp" },
    { name: "Brasil", code: "br" },
    { name: "Canadá", code: "ca" },
    { name: "Colombia", code: "co" },
    { name: "Portugal", code: "pt" },
    { name: "Reino Unido", code: "gb" }
  ];

  let currentCountry = null;
  let score = 0;

  function nextQuestion() {
    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";

    // Seleccionar país correcto al azar
    const randomIndex = Math.floor(Math.random() * countries.length);
    currentCountry = countries[randomIndex];

    // Mostrar bandera
    document.getElementById("flag").src = `https://flagcdn.com/w320/${currentCountry.code}.png`;

    // Generar 3 opciones incorrectas
    const wrongOptions = countries.filter(c => c.code !== currentCountry.code);
    const shuffledWrong = wrongOptions.sort(() => 0.5 - Math.random()).slice(0, 3);
    
    // Mezclar las 4 opciones finales
    const allOptions = [...shuffledWrong, currentCountry].sort(() => 0.5 - Math.random());

    allOptions.forEach(country => {
      const btn = document.createElement("button");
      btn.textContent = country.name;
      btn.onclick = () => checkAnswer(btn, country.code);
      optionsContainer.appendChild(btn);
    });
  }

  function checkAnswer(selectedBtn, selectedCode) {
    const buttons = document.querySelectorAll("#options button");
    buttons.forEach(btn => btn.disabled = true);

    if (selectedCode === currentCountry.code) {
      selectedBtn.classList.add("correct");
      score++;
      document.getElementById("score").textContent = score;
    } else {
      selectedBtn.classList.add("incorrect");
    }

    setTimeout(nextQuestion, 1200);
  }

  // Iniciar juego
  nextQuestion();
</script>

</body>
</html>
